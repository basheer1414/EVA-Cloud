name: Import latest DeerFlow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-deerflow.yml'
      - 'IMPORT_NOW'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EVA Cloud
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone latest DeerFlow main
        run: git clone --depth 1 https://github.com/bytedance/deer-flow.git /tmp/deer-flow

      - name: Mirror DeerFlow source and preserve importer
        shell: bash
        run: |
          cp .github/workflows/import-deerflow.yml /tmp/import-deerflow.yml
          rsync -a --delete --exclude '.git' /tmp/deer-flow/ ./
          mkdir -p .github/workflows
          cp /tmp/import-deerflow.yml .github/workflows/import-deerflow.yml
          printf '%s\n' 'Upstream: https://github.com/bytedance/deer-flow' "Imported commit: $(git -C /tmp/deer-flow rev-parse HEAD)" > EVA_UPSTREAM.txt

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name 'EVA Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi
          git commit -m 'Import latest ByteDance DeerFlow main'
          git push origin main
